# Calls the site's snapshot endpoint every 30 minutes so clan history keeps building.
# Set two repository secrets: SITE_URL (e.g. https://your-site.example) and CRON_SECRET
# (the same value as the site's CRON_SECRET). Without SITE_URL the job does nothing.
name: History snapshots and player directory

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Trigger snapshot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL secret not set; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/snapshot"
      # Saves a slice of every country's Path of Legends leaderboard for player name search.
      - name: Refresh the player name directory
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then exit 0; fi
          curl --fail --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/directory"
